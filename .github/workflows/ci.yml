name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      # torch is not a managed dependency: locally it is a ROCm build installed
      # by hand, so we keep it out of pyproject/uv.lock to avoid clobbering it on
      # `uv sync`. CI runs on CPU, so install the CPU wheel explicitly here.
      - name: Install PyTorch (CPU)
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Type check (ty)
        run: uv run ty check src

      - name: Pytest
        run: uv run pytest
