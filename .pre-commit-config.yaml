# Run: uv run pre-commit install
# Keeps lint/format green before every commit. Ruff version is pinned and should
# track the `ruff` pin in pyproject.toml's dev group.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
