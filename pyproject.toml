[project]
name = "factlens"
version = "0.1.0"
description = "Binary fake-news classifier (BiLSTM + Attention, GloVe 300d) — BSc thesis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=0.4.1",
    "nltk>=3.9",
    "pandas<3.0",
    "plotly>=6.7.0",
    "scikit-learn>=1.8.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (kolejność importów)
    "N",   # pep8-naming
    "UP",  # pyupgrade (nowoczesna składnia, np. list[int] zamiast List[int])
    "ANN", # flake8-annotations (brakujące adnotacje typów)
    "B",   # flake8-bugbear (częste błędy logiczne)
    "SIM", # flake8-simplify (uproszczenia kodu)
    "TCH", # flake8-type-checking (importy tylko pod TYPE_CHECKING)
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "PLR0913", # too many arguments — bywa słuszne w DS
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["ANN", "T201", "PL"] # notebooki: luz na adnotacje i printy
"tests/**" = [
    "ANN",     # testy: bez adnotacji
    "S101",    # assert dozwolony
    "PLR2004", # magic values w asercjach są naturalne
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.15.15",
    "ty>=0.0.1a13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]
